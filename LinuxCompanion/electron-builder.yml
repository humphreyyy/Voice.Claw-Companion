appId: ai.voiceclaw.companion.linux
productName: VoiceClaw Companion
executableName: voiceclaw-companion
disableDefaultIgnoredFiles: true
directories:
  output: dist
  buildResources: build-resources
files:
  - out/**
  - package.json
extraResources:
  - from: build-resources/BridgeRuntime
    to: BridgeRuntime
  - from: build-resources/BridgeRuntime/node_modules
    to: BridgeRuntime/node_modules
    filter:
      - "**/*"
  - from: build-resources/service/bridge-entry.mjs
    to: service/bridge-entry.mjs
  - from: build-resources/AppIcon-1024.png
    to: AppIcon-1024.png
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Utility
  icon: build-resources/AppIcon-1024.png
  syncDesktopName: true
  artifactName: voiceclaw-companion_${version}_${arch}.${ext}
deb:
  packageCategory: utils
  priority: optional
  synopsis: Linux companion for VoiceClaw Realtime
